<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#0F243A" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#dashBg)" />
  
  <!-- Outer Frame -->
  <rect x="40" y="30" width="720" height="440" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  
  <!-- Top Bar -->
  <path d="M40 30 h720 v45 h-720 z" fill="#1E293B" rx="14" />
  <circle cx="65" cy="52" r="5" fill="#EF4444" />
  <circle cx="82" cy="52" r="5" fill="#F59E0B" />
  <circle cx="99" cy="52" r="5" fill="#10B981" />
  <text x="130" y="56" fill="#94A3B8" font-family="sans-serif" font-size="13">Student Performance Analytics // FastAPI + MongoDB</text>

  <!-- Metric Card 1 -->
  <rect x="65" y="95" width="200" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="85" y="125" fill="#94A3B8" font-family="sans-serif" font-size="11">AVERAGE BATCH CGPA</text>
  <text x="85" y="160" fill="#38BDF8" font-family="sans-serif" font-size="28" font-weight="800">8.64</text>
  <text x="150" y="160" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">↑ +0.42</text>

  <!-- Metric Card 2 -->
  <rect x="285" y="95" width="220" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="305" y="125" fill="#94A3B8" font-family="sans-serif" font-size="11">OVERALL ATTENDANCE</text>
  <text x="305" y="160" fill="#F8FAFC" font-family="sans-serif" font-size="28" font-weight="800">91.8%</text>
  <text x="405" y="160" fill="#38BDF8" font-family="sans-serif" font-size="12" font-weight="600">Target met</text>

  <!-- Metric Card 3 -->
  <rect x="525" y="95" width="215" height="90" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <text x="545" y="125" fill="#94A3B8" font-family="sans-serif" font-size="11">ACTIVE SUBJECT MODULES</text>
  <text x="545" y="160" fill="#A78BFA" font-family="sans-serif" font-size="28" font-weight="800">06 / 06</text>

  <!-- Performance Chart Area -->
  <rect x="65" y="205" width="440" height="240" rx="10" fill="#131D31" stroke="#334155" stroke-width="1" />
  <text x="85" y="235" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="700">Semester Marks Progression</text>
  
  <!-- Bar chart bars -->
  <g transform="translate(100, 390)">
    <line x1="0" y1="0" x2="380" y2="0" stroke="#334155" stroke-width="1" />
    <!-- Bar 1 -->
    <rect x="20" y="-80" width="35" height="80" rx="4" fill="url(#barGrad)" />
    <text x="37" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Sem 1</text>
    <!-- Bar 2 -->
    <rect x="80" y="-105" width="35" height="105" rx="4" fill="url(#barGrad)" />
    <text x="97" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Sem 2</text>
    <!-- Bar 3 -->
    <rect x="140" y="-120" width="35" height="120" rx="4" fill="url(#barGrad)" />
    <text x="157" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Sem 3</text>
    <!-- Bar 4 -->
    <rect x="200" y="-135" width="35" height="135" rx="4" fill="url(#barGrad)" />
    <text x="217" y="18" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Sem 4</text>
    <!-- Bar 5 Current -->
    <rect x="260" y="-150" width="35" height="150" rx="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />
    <text x="277" y="18" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Sem 5</text>
  </g>

  <!-- Side Subject List -->
  <rect x="525" y="205" width="215" height="240" rx="10" fill="#131D31" stroke="#334155" stroke-width="1" />
  <text x="545" y="235" fill="#F8FAFC" font-family="sans-serif" font-size="13" font-weight="700">Course Tracking</text>
  
  <rect x="545" y="255" width="175" height="38" rx="6" fill="#1E293B" />
  <text x="555" y="278" fill="#E2E8F0" font-family="sans-serif" font-size="11">Machine Learning</text>
  <text x="705" y="278" fill="#10B981" font-family="sans-serif" font-size="11" text-anchor="end">94%</text>

  <rect x="545" y="302" width="175" height="38" rx="6" fill="#1E293B" />
  <text x="555" y="325" fill="#E2E8F0" font-family="sans-serif" font-size="11">Data Structures (C++)</text>
  <text x="705" y="325" fill="#10B981" font-family="sans-serif" font-size="11" text-anchor="end">91%</text>

  <rect x="545" y="349" width="175" height="38" rx="6" fill="#1E293B" />
  <text x="555" y="372" fill="#E2E8F0" font-family="sans-serif" font-size="11">Database Systems</text>
  <text x="705" y="372" fill="#38BDF8" font-family="sans-serif" font-size="11" text-anchor="end">88%</text>

  <rect x="545" y="396" width="175" height="38" rx="6" fill="#1E293B" />
  <text x="555" y="419" fill="#E2E8F0" font-family="sans-serif" font-size="11">Deep Learning</text>
  <text x="705" y="419" fill="#38BDF8" font-family="sans-serif" font-size="11" text-anchor="end">89%</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="calBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E1622" />
    </linearGradient>
    <linearGradient id="calRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#calBg)" />
  <rect x="40" y="30" width="720" height="440" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  
  <!-- Header -->
  <path d="M40 30 h720 v45 h-720 z" fill="#1E293B" rx="14" />
  <circle cx="65" cy="52" r="5" fill="#EF4444" />
  <circle cx="82" cy="52" r="5" fill="#F59E0B" />
  <circle cx="99" cy="52" r="5" fill="#10B981" />
  <text x="130" y="56" fill="#94A3B8" font-family="sans-serif" font-size="13">Calorie Tracker Dashboard // Real-time Nutrition & Goal Recalculation</text>

  <!-- Circular Progress Ring (Calories Remaining) -->
  <g transform="translate(180, 240)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#1E293B" stroke-width="18" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#10B981" stroke-width="18" stroke-dasharray="628" stroke-dashoffset="210" stroke-linecap="round" transform="rotate(-90)" />
    <text x="0" y="-15" fill="#94A3B8" font-family="sans-serif" font-size="12" text-anchor="middle">REMAINING</text>
    <text x="0" y="25" fill="#F8FAFC" font-family="sans-serif" font-size="36" font-weight="800" text-anchor="middle">750</text>
    <text x="0" y="48" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">kcal left today</text>
  </g>

  <!-- Right Side Stat Summary Cards -->
  <g transform="translate(350, 100)">
    <!-- Daily Goal Card -->
    <rect x="0" y="0" width="370" height="85" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <text x="25" y="30" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="700">DAILY CALORIE GOAL</text>
    <text x="25" y="65" fill="#F8FAFC" font-family="sans-serif" font-size="28" font-weight="800">2,200</text>
    <text x="110" y="65" fill="#94A3B8" font-family="sans-serif" font-size="13">kcal/day</text>
    <rect x="250" y="25" width="95" height="32" rx="6" fill="#0284C7" />
    <text x="297" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Edit Goal</text>

    <!-- Calories Consumed Card -->
    <rect x="0" y="100" width="370" height="85" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="25" y="130" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="700">CALORIES CONSUMED</text>
    <text x="25" y="165" fill="#F8FAFC" font-family="sans-serif" font-size="28" font-weight="800">1,450</text>
    <text x="115" y="165" fill="#94A3B8" font-family="sans-serif" font-size="13">kcal logged (66%)</text>

    <!-- Macro Breakdown -->
    <rect x="0" y="200" width="370" height="110" rx="10" fill="#131D31" stroke="#334155" stroke-width="1" />
    <text x="25" y="230" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="700">MACRONUTRIENT RATIOS</text>
    
    <text x="25" y="260" fill="#E2E8F0" font-family="sans-serif" font-size="12">Protein (110g)</text>
    <text x="160" y="260" fill="#E2E8F0" font-family="sans-serif" font-size="12">Carbs (175g)</text>
    <text x="280" y="260" fill="#E2E8F0" font-family="sans-serif" font-size="12">Fats (48g)</text>

    <rect x="25" y="275" width="100" height="8" rx="4" fill="#3B82F6" />
    <rect x="145" y="275" width="100" height="8" rx="4" fill="#10B981" />
    <rect x="265" y="275" width="80" height="8" rx="4" fill="#F59E0B" />
  </g>
</svg>
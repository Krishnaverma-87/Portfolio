  <text x="495" y="352" fill="#94A3B8" font-family="sans-serif" font-size="10">Designed exclusively as a routine</text>
  <text x="495" y="368" fill="#94A3B8" font-family="sans-serif" font-size="10">and caregiver assistance companion.</text>
  <text x="495" y="384" fill="#94A3B8" font-family="sans-serif" font-size="10">No diagnostic claims.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#A5B4FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="200" fill="url(#avatarBg)" />

  <!-- Outer Neon Pulse Rings -->
  <circle cx="200" cy="200" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="200" cy="200" r="175" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.5" />

  <!-- Neural Nodes Pattern Background -->
  <g opacity="0.25">
    <circle cx="90" cy="110" r="4" fill="#38BDF8" />
    <circle cx="150" cy="80" r="3" fill="#818CF8" />
    <circle cx="310" cy="120" r="4" fill="#38BDF8" />
    <circle cx="270" cy="70" r="3" fill="#C084FC" />
    <circle cx="80" cy="290" r="4" fill="#A855F7" />
    <circle cx="330" cy="280" r="4" fill="#38BDF8" />
    <circle cx="200" cy="340" r="3" fill="#818CF8" />
    <line x1="90" y1="110" x2="150" y2="80" stroke="#818CF8" stroke-width="1" />
    <line x1="270" y1="70" x2="310" y2="120" stroke="#818CF8" stroke-width="1" />
    <line x1="80" y1="290" x2="140" y2="330" stroke="#818CF8" stroke-width="1" />
    <line x1="280" y1="330" x2="330" y2="280" stroke="#818CF8" stroke-width="1" />
  </g>

  <!-- Inner Badge Glow Layer -->
  <circle cx="200" cy="200" r="145" fill="#1E293B" fill-opacity="0.6" stroke="url(#ringGrad)" stroke-width="2" />

  <!-- KV Monogram -->
  <text x="200" y="228" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="116" 
        font-weight="900" 
        letter-spacing="4"
        text-anchor="middle" 
        fill="url(#textGrad)" 
        filter="url(#glow)">KV</text>

  <!-- Subtle AI / Status Badge at bottom -->
  <g transform="translate(140, 290)">
    <rect width="120" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.9" />
    <circle cx="20" cy="13" r="4" fill="#10B981" />
    <text x="68" y="18" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AIML DEV</text>
  </g>
</svg>